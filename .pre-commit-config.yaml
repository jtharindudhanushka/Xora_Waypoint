default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: \.md$
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: no-competition-data
        name: block competition data (ADR-0007)
        entry: python scripts/hooks/check_no_data_files.py
        language: system
        pass_filenames: true
      - id: commit-msg-rules
        name: conventional commits + no AI trailers
        entry: python scripts/hooks/check_commit_msg.py
        language: system
        stages: [commit-msg]
