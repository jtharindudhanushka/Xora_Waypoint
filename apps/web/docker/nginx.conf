# Serves the built PWA and proxies /api to the FastAPI service (one origin: no CORS in production).
server {
  listen 8080;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Server-Sent Events: no buffering, long-lived connections.
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  # The service worker must always be revalidated so updates reach devices.
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

  # Client-side routing: unknown paths serve the app shell.
  location / { try_files $uri /index.html; }
}
