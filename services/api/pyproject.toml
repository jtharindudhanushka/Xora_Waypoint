[project]
name = "xora-api"
version = "0.1.0"
description = "Xora · Waypoint delivery planning API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.32",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pyjwt>=2.9",
  "bcrypt>=4.2",
  "structlog>=24.4",
  "pyyaml>=6.0",
  "pandas>=2.2",
  "email-validator>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[build-system]
requires = ["setuptools>=72"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
